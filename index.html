<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript Class inheritence</h2>
        <p>Use the "extend" keyword to inherit all methods from another class.</p>
        <p>Use the "super" keyword to call all parent's constructor functions.</p>
        <p id="details"></p>
        <script>
            class Car {
                constructor(brand) {
                    this.carname = brand;
                                   }
            present() {
                return 'I have a ' + this.carname;
                      }
                  }
                  class Model extends Car {
                    constructor(brand, mod) {
                        super(brand);
                        this.model = mod;
                    }
                    show() {
                        return this.present() + 'It is a ' + this.model;
                    }
                  }

                  let myCar = new Model ("Mercedes ", "Toyota ");
                  document.getElementById("details").innerHTML = myCar.show();
                  </script>
                  </body>
                  </html>
